name: Daily Update

on:
  schedule:
    # Runs at 06:00 UTC every day (adjust as needed)
    - cron: '0 6 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grant write permissions so the action can push commits
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Use a token that can push (GITHUB_TOKEN works with contents: write)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run update.sh
        run: |
          chmod +x ./update.sh
          ./update.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily update $(date -u +'%Y-%m-%d')"
            git push
          fi

